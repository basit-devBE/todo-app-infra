AWSTemplateFormatVersion: '2010-09-09'
Description: >
  To-Do App - RDS PostgreSQL instance (db.t3 family, Multi-AZ) in dedicated
  private subnets, credentials generated into Secrets Manager, fronted by
  RDS Proxy so the app only ever talks to the proxy endpoint.

Parameters:
  ProjectName:
    Type: String
    Default: todo-app

  DataSubnet1Id:
    Type: AWS::EC2::Subnet::Id

  DataSubnet2Id:
    Type: AWS::EC2::Subnet::Id

  RdsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

  RdsProxySecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

  DBInstanceClass:
    Type: String
    Default: db.t3.micro

  DBName:
    Type: String
    Default: tododb

  DBAllocatedStorage:
    Type: Number
    Default: 20

Resources:
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: !Sub ${ProjectName}-db-subnet-group
      DBSubnetGroupDescription: Private data subnets for the To-Do app RDS instance and RDS Proxy
      SubnetIds:
        - !Ref DataSubnet1Id
        - !Ref DataSubnet2Id
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-db-subnet-group
        - Key: Project
          Value: !Ref ProjectName

  DBSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${ProjectName}/db-credentials
      Description: Master credentials for the To-Do app RDS instance
      GenerateSecretString:
        SecretStringTemplate: '{"username":"todoapp_admin"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\'
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  DBInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub ${ProjectName}-db
      Engine: postgres
      DBInstanceClass: !Ref DBInstanceClass
      DBName: !Ref DBName
      AllocatedStorage: !Ref DBAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: true
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      DeletionProtection: false
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref RdsSecurityGroupId
      MasterUsername: !Sub '{{resolve:secretsmanager:${DBSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DBSecret}:SecretString:password}}'
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-db
        - Key: Project
          Value: !Ref ProjectName

  DBSecretTargetAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref DBSecret
      TargetId: !Ref DBInstance
      TargetType: AWS::RDS::DBInstance

  RdsProxyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-rds-proxy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: rds.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadDbSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DBSecret
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  RdsProxy:
    Type: AWS::RDS::DBProxy
    Properties:
      DBProxyName: !Sub ${ProjectName}-proxy
      EngineFamily: POSTGRESQL
      RoleArn: !GetAtt RdsProxyRole.Arn
      VpcSubnetIds:
        - !Ref DataSubnet1Id
        - !Ref DataSubnet2Id
      VpcSecurityGroupIds:
        - !Ref RdsProxySecurityGroupId
      RequireTLS: true
      Auth:
        - AuthScheme: SECRETS
          SecretArn: !Ref DBSecret
          IAMAuth: DISABLED

  RdsProxyTargetGroup:
    Type: AWS::RDS::DBProxyTargetGroup
    Properties:
      DBProxyName: !Ref RdsProxy
      TargetGroupName: default
      DBInstanceIdentifiers:
        - !Ref DBInstance
      ConnectionPoolConfigurationInfo:
        MaxConnectionsPercent: 100
        MaxIdleConnectionsPercent: 50

Outputs:
  DBSecretArn:
    Value: !Ref DBSecret

  DBInstanceEndpointAddress:
    Value: !GetAtt DBInstance.Endpoint.Address

  RdsProxyEndpoint:
    Value: !GetAtt RdsProxy.Endpoint

  DBName:
    Value: !Ref DBName
