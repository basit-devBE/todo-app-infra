AWSTemplateFormatVersion: '2010-09-09'
Description: >
  To-Do App - ElastiCache Redis replication group (primary + replica) in
  dedicated cache subnets, used as a read-through cache in front of RDS.

Parameters:
  ProjectName:
    Type: String
    Default: todo-app

  CacheSubnet1Id:
    Type: AWS::EC2::Subnet::Id

  CacheSubnet2Id:
    Type: AWS::EC2::Subnet::Id

  RedisSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

  CacheNodeType:
    Type: String
    Default: cache.t3.micro

Resources:
  CacheSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: Private cache subnets for the To-Do app Redis replication group
      SubnetIds:
        - !Ref CacheSubnet1Id
        - !Ref CacheSubnet2Id

  RedisReplicationGroup:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupId: !Sub ${ProjectName}-redis
      ReplicationGroupDescription: !Sub ${ProjectName} read-cache for the To-Do app
      Engine: redis
      CacheNodeType: !Ref CacheNodeType
      NumCacheClusters: 2
      AutomaticFailoverEnabled: true
      MultiAZEnabled: true
      CacheSubnetGroupName: !Ref CacheSubnetGroup
      SecurityGroupIds:
        - !Ref RedisSecurityGroupId
      AtRestEncryptionEnabled: true
      TransitEncryptionEnabled: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-redis
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  RedisPrimaryEndpointAddress:
    Value: !GetAtt RedisReplicationGroup.PrimaryEndPoint.Address

  RedisPrimaryEndpointPort:
    Value: !GetAtt RedisReplicationGroup.PrimaryEndPoint.Port
