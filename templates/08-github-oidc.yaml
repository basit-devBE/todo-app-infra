AWSTemplateFormatVersion: '2010-09-09'
Description: >
  To-Do App - GitHub Actions OIDC provider + a role the app-code repo's
  workflow can assume (no long-lived AWS keys) to push images to ECR and
  upload blue/green deploy artifacts to S3.

Parameters:
  EnvironmentName:
    Type: String
    Default: todo-app
  GitHubOrg:
    Type: String
    Description: GitHub org or username that owns the app-code repo
  GitHubRepo:
    Type: String
    Description: Name of the app-code (Java app + Dockerfile) repository
    Default: todo-app-code
  AllowedGitRef:
    Type: String
    Description: Branch allowed to assume this role via OIDC
    Default: refs/heads/main
  # Create the provider only on first deploy; if a GitHub OIDC provider
  # already exists in this account (e.g. from another project), set to
  # 'false' and pass ExistingOIDCProviderArn instead.
  CreateOIDCProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
  ExistingOIDCProviderArn:
    Type: String
    Default: ''

Conditions:
  ShouldCreateProvider: !Equals [!Ref CreateOIDCProvider, 'true']

Resources:
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-github-actions-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateProvider
                - !Ref GitHubOIDCProvider
                - !Ref ExistingOIDCProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}/${GitHubRepo}:ref:${AllowedGitRef}
      Policies:
        - PolicyName: ecr-push-and-artifact-upload
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                Resource:
                  Fn::ImportValue: !Sub ${EnvironmentName}-EcrRepositoryArn
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - Fn::Sub:
                      - arn:aws:s3:::${BucketName}/deploy/*
                      - BucketName:
                          Fn::ImportValue: !Sub ${EnvironmentName}-ArtifactBucketName

Outputs:
  GitHubActionsDeployRoleArn:
    Value: !GetAtt GitHubActionsDeployRole.Arn
    Export:
      Name: !Sub ${EnvironmentName}-GitHubActionsDeployRoleArn
